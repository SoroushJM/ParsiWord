name: Build iOS simulator app
on: workflow_dispatch
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec playwright install webkit
      - run: pnpm run test:ui --project webkit
        env:
          PW_WEBKIT: '1'
      - run: pnpm run ios:init
      - run: pnpm run ios:simulator
      - name: Preserve app bundle metadata
        shell: bash
        run: |
          mkdir -p artifacts
          app_path="$(find apps/parsiword/src-tauri/gen/apple apps/parsiword/src-tauri/target -type d -name '*.app' -prune -print | head -1)"
          test -n "$app_path"
          tar -czf artifacts/ParsiWord-iOS-simulator.tar.gz -C "$(dirname "$app_path")" "$(basename "$app_path")"
      - uses: actions/upload-artifact@v4
        with:
          name: ParsiWord-iOS-simulator
          path: artifacts/ParsiWord-iOS-simulator.tar.gz
          if-no-files-found: error
